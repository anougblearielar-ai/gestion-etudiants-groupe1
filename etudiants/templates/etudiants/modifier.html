
{% extends 'etudiants/base.html' %}

{% block title %}Modifier un étudiant{% endblock %}

{% block content %}

<h2>Modifier les informations de l'étudiant</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Enregistrer les modifications</button>

    <a href="{% url 'liste_etudiants' %}">Annuler</a>
</form>

{% endblock %}
