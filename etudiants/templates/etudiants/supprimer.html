
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer un étudiant</title>
</head>
<body>
    <h1>Confirmer la suppression</h1>

    <p>Voulez-vous vraiment supprimer
        {{ etudiant.nom }} {{ etudiant.prenom }} ?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Oui, supprimer</button>
    </form>

    <a href="{% url 'liste_etudiants' %}">Annuler</a>
</body>
</html>
