
{% extends 'etudiants/base.html' %}

{% block title %}Supprimer un étudiant{% endblock %}

{% block content %}

<h2>Supprimer un étudiant</h2>
<p>
    Voulez-vous vraiment supprimer
    <strong>{{ etudiant.prenom }} {{ etudiant.nom }}</strong> ?
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
    <a href="{% url 'liste_etudiants' %}">Annuler</a>
</form>
{% endblock %}
